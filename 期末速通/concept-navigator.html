        // 渲染卡片（新版）
        function renderChapters() {
            const container = document.getElementById('concepts-container');
            container.innerHTML = '';

            let allVizCount = 0;
            let newVizCount = 0;
            let totalConcepts = 0;

            chaptersData.forEach(chapter => {
                let chapterHasViz = false;
                const chapterGrid = document.createElement('div');
                chapterGrid.className = 'card-grid';
                chapterGrid.id = `chapter-${chapter.id}-cards`;

                chapter.sections.forEach(section => {
                    section.concepts.forEach(concept => {
                        totalConcepts++;
                        if (concept.hasViz) {
                            allVizCount++;
                            if (concept.isNew) newVizCount++;
                            chapterHasViz = true;

                            // 创建可视化卡片
                            const card = createVizCard(concept, chapter.title, section.title);
                            chapterGrid.appendChild(card);
                        }
                    });
                });

                if (chapterHasViz) {
                    // 添加章节标题
                    const divider = document.createElement('div');
                    divider.className = 'section-divider';
                    divider.innerHTML = `<span>📚</span><span>${chapter.title}</span>`;
                    container.appendChild(divider);

                    container.appendChild(chapterGrid);
                }
            });

            // 更新统计
            document.getElementById('viz-count').textContent = allVizCount;
            document.getElementById('new-viz-count').textContent = newVizCount;
            const coverage = ((allVizCount / totalConcepts) * 100).toFixed(1);
            document.getElementById('coverage-rate').textContent = coverage + '%';
        }

        // 创建可视化卡片
        function createVizCard(concept, chapterTitle, sectionTitle) {
            const card = document.createElement('a');
            card.href = concept.url;
            card.className = 'viz-card';
            if (concept.isNew) {
                card.classList.add('new-badge');
            }
            card.target = '_blank';

            // 根据概念名称选择图标
            const icon = getConceptIcon(concept.name);

            // 生成描述
            const description = generateConceptDescription(concept.name);

            // 提取章节编号
            const chapterNum = chapterTitle.match(/第(.+)章/)[1];
            const sectionTitleShort = sectionTitle.replace(/^§\d+\s*/, '');

            card.innerHTML = `
                <div class="card-icon">${icon}</div>
                <div class="card-title">${concept.name}</div>
                <div class="card-desc">${description}</div>
                <div class="card-meta">
                    <span class="tag chapter">第${chapterNum}章</span>
                    <span class="tag section">${sectionTitleShort}</span>
                    ${concept.isNew ? '<span class="tag difficulty">新增</span>' : ''}
                </div>
            `;

            return card;
        }

                '指数分布': '⏱️',
                '二维正态分布': '🌐',
                '条件概率': '🔗',

            };

            for (const [key, icon] of Object.entries(iconMap)) {
                if (conceptName.includes(key)) {

        // 更新统计数据
        function updateStats() {
            let totalConcepts = 0;
            let hasVizCount = 0;
            let newVizCount = 0;

            chaptersData.forEach(chapter => {
                chapter.sections.forEach(section => {
                    section.concepts.forEach(concept => {
                        totalConcepts++;
                        if (concept.hasViz) {
                            hasVizCount++;
                            if (concept.isNew) newVizCount++;
                        }
                    });
                });
            });

            const coverageRate = ((hasVizCount / totalConcepts) * 100).toFixed(1);

            document.getElementById('viz-count').textContent = hasVizCount;
            document.getElementById('new-viz-count').textContent = newVizCount;
            document.getElementById('coverage-rate').textContent = coverageRate + '%';
        }
