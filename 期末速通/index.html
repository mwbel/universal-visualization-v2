<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期末速通</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            text-align: center;
        }

        .header {
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            font-size: 64px;
            color: #1976D2;
            margin-bottom: 16px;
            text-shadow: none;
            letter-spacing: 2px;
        }

        .header .subtitle {
            font-size: 20px;
            color: #546e7a;
            font-weight: 300;
        }

        .course-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 40px;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .course-btn {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        .course-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #2196F3 0%, #1976D2 100%);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .course-btn:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .course-btn:hover::before {
            transform: scaleX(1);
        }

        .course-icon {
            font-size: 72px;
            line-height: 1;
            margin-bottom: 8px;
        }

        .course-title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .course-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            max-width: 220px;
        }

        .course-arrow {
            font-size: 24px;
            color: #2196F3;
            margin-top: 8px;
            transition: transform 0.3s ease;
        }

        .course-btn:hover .course-arrow {
            transform: translateX(8px);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 48px;
            }

            .header .subtitle {
                font-size: 16px;
            }

            .course-buttons {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .course-btn {
                padding: 30px 20px;
            }

            .course-icon {
                font-size: 56px;
            }

            .course-title {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🎯 期末速通</h1>
            <p class="subtitle">多门课程 · 高效攻关</p>
        </div>

        <div class="course-buttons">
            <!-- C++程序设计 -->
            <a href="cpp/index.html" class="course-btn">
                <div class="course-icon">💻</div>
                <div class="course-title">C++程序设计</div>
                <div class="course-desc">面向对象、继承多态、STL容器</div>
                <div class="course-arrow">→</div>
            </a>

            <!-- 概率论与数理统计 -->
            <a href="概率统计可视化/index.html" class="course-btn">
                <div class="course-icon">📊</div>
                <div class="course-title">概率论与数理统计</div>
                <div class="course-desc">分布可视化、统计推断、假设检验</div>
                <div class="course-arrow">→</div>
            </a>

            <!-- 大学物理（二） -->
            <a href="physics/index.html" class="course-btn">
                <div class="course-icon">⚛️</div>
                <div class="course-title">大学物理（二）</div>
                <div class="course-desc">电磁学、波动光学、近代物理</div>
                <div class="course-arrow">→</div>
            </a>
        </div>

    </div>
    </div>
</body>

</html>
