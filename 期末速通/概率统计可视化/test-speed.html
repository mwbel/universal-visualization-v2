<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试 - 加载速度优化</title>
    <style>
        body {margin: 0; padding: 20px; font-family: system-ui, sans-serif;}
        .status {padding: 20px; background: #e3f2fd; border-radius: 8px; margin: 20px 0;}
        .success {background: #d4edda; color: #155724;}
        .error {background: #f8d7da; color: #721c24;}
        h1 {color: #5B8CBA;}
    </style>

    <!-- 🚀 极速加载优化：本地资源 + 懒加载 -->
    <script>
    /* Plotly懒加载：只在需要时加载 */
    window.PlotlyLazyLoader = {
        loaded: false,
        callbacks: [],
        load: function(callback) {
            if (this.loaded) {
                callback();
            } else {
                this.callbacks.push(callback);
                if (this.callbacks.length === 1) {
                    var script = document.createElement("script");
                    script.src = "lib/plotly.min.js";
                    script.onload = () => {
                        this.loaded = true;
                        this.callbacks.forEach(cb => cb());
                        this.callbacks = [];
                    };
                    document.head.appendChild(script);
                }
            }
        }
    };
    </script>
    <script>
    /* MathJax配置 - 内联以加快渲染 */
    window.MathJax = {
        tex: {
            inlineMath: [["\$","\$"], ["\\(","\\)"]],
            displayMath: [["\\$","\\$"], ["\\[","\\]"]],
            processEscapes: true
        },
        svg: {
            fontCache: "global"
        },
        startup: {
            typeset: false,
            ready: () => {
                MathJax.startup.defaultReady();
                console.log("✅ MathJax加载完成");
            }
        }
    };
    </script>
    <link rel="preload" href="lib/plotly.min.js" as="script" crossorigin="anonymous">
    <link rel="preload" href="lib/tex-mml-chtml.js" as="script" crossorigin="anonymous">
    <script id="MathJax-script" defer src="lib/tex-mml-chtml.js" onload="console.log("✅ MathJax脚本加载完成")"></script>
    <!-- Plotly.js (延迟加载) -->
</head>
<body>
    <h1>🚀 页面加载速度测试</h1>

    <div id="status" class="status">
        ⏳ 正在检测页面加载时间...
    </div>

    <div id="plot-test" style="width:100%;height:400px;background:#f8f9fa;border-radius:8px;display:flex;align-items:center;justify-content:center;">
        <p style="color:#666;">等待Plotly加载...</p>
    </div>

    <script>
        // 记录加载时间
        const loadTime = performance.now();
        console.log(`⏱️ 页面开始加载时间: ${loadTime}ms`);

        window.addEventListener('load', function() {
            const fullLoadTime = performance.now();
            console.log(`✅ 页面完全加载时间: ${fullLoadTime}ms`);
            console.log(`📊 DOM加载耗时: ${(fullLoadTime - loadTime).toFixed(2)}ms`);

            // 检查Plotly
            setTimeout(function() {
                if (typeof Plotly !== 'undefined') {
                    document.getElementById('status').innerHTML = `
                        <div class="success">
                            <h3>✅ 加载成功！</h3>
                            <p><strong>DOM加载时间:</strong> ${(fullLoadTime - loadTime).toFixed(2)}ms</p>
                            <p><strong>Plotly状态:</strong> ✅ 已加载</p>
                            <p><strong>优化策略:</strong></p>
                            <ul>
                                <li>✅ 使用defer延迟加载脚本</li>
                                <li>✅ 内联CSS（无外部请求）</li>
                                <li>✅ window.onload触发（而非DOMContentLoaded）</li>
                            </ul>
                        </div>
                    `;

                    // 测试Plotly
                    const layout = {
                        title: '测试图表',
                        xaxis: {title: 'X'},
                        yaxis: {title: 'Y'}
                    };
                    const trace = {
                        x: [1,2,3,4],
                        y: [10,15,13,17],
                        type: 'scatter',
                        mode: 'lines+markers'
                    };
                    Plotly.newPlot('plot-test', [trace], layout, {responsive: true});
                } else {
                    document.getElementById('status').innerHTML = `
                        <div class="error">
                            <h3>❌ Plotly加载失败</h3>
                            <p>请检查网络连接或CDN是否可访问</p>
                        </div>
                    `;
                }
            }, 100);
        });
    </script>
</body>
</html>
