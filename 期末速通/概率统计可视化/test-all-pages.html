<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>概率统计可视化 - 测试页面</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .test-controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .test-controls button {
            padding: 12px 24px;
            margin-right: 10px;
            margin-bottom: 10px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .test-controls button:hover {
            background: #3367d6;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(66,133,244,0.4);
        }

        .test-controls button.success {
            background: #34a853;
        }

        .test-controls button.error {
            background: #ea4335;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 36px;
            font-weight: bold;
            color: #4285f4;
        }

        .pages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s;
            border-left: 5px solid #ddd;
        }

        .page-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        .page-card.status-pending {
            border-left-color: #fbbc04;
        }

        .page-card.status-success {
            border-left-color: #34a853;
        }

        .page-card.status-error {
            border-left-color: #ea4335;
        }

        .page-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .page-card-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .page-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .page-badge.pending {
            background: #fef7e0;
            color: #f9ab00;
        }

        .page-badge.success {
            background: #e6f4ea;
            color: #34a853;
        }

        .page-badge.error {
            background: #fce8e6;
            color: #ea4335;
        }

        .page-card-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .page-card-info {
            font-size: 13px;
            color: #999;
            margin-bottom: 15px;
        }

        .page-card-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .page-card-actions a {
            padding: 8px 16px;
            background: #4285f4;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
            flex: 1;
            text-align: center;
        }

        .page-card-actions a:hover {
            background: #3367d6;
        }

        .page-card-actions a.test {
            background: #fbbc04;
            color: #333;
        }

        .page-card-actions a.test:hover {
            background: #f9ab00;
        }

        .test-log {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-height: 400px;
            overflow-y: auto;
        }

        .test-log h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .log-entry {
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            border-left: 4px solid #ddd;
        }

        .log-entry.info {
            background: #e3f2fd;
            border-left-color: #2196f3;
        }

        .log-entry.success {
            background: #e6f4ea;
            border-left-color: #34a853;
        }

        .log-entry.error {
            background: #fce8e6;
            border-left-color: #ea4335;
        }

        .log-entry .timestamp {
            color: #666;
            font-size: 12px;
            margin-right: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4285f4, #34a853);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4285f4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 概率统计可视化 - 测试页面</h1>
            <p>自动化测试所有可视化页面的加载和基本功能</p>
        </div>

        <div class="test-controls">
            <button id="runAllTests" onclick="runAllTests()">▶️ 运行所有测试</button>
            <button id="clearLog" onclick="clearLog()">🗑️ 清空日志</button>
            <button onclick="window.location.reload()">🔄 刷新页面</button>
            <button onclick="exportReport()">📥 导出测试报告</button>
            <div style="margin-top: 15px;">
                <div style="font-size: 14px; color: #666; margin-bottom: 5px;">测试进度</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%;">0%</div>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>总页面数</h3>
                <div class="value" id="totalPages">10</div>
            </div>
            <div class="stat-card">
                <h3>已测试</h3>
                <div class="value" id="testedPages">0</div>
            </div>
            <div class="stat-card">
                <h3>成功</h3>
                <div class="value" style="color: #34a853;" id="successPages">0</div>
            </div>
            <div class="stat-card">
                <h3>失败</h3>
                <div class="value" style="color: #ea4335;" id="errorPages">0</div>
            </div>
            <div class="stat-card">
                <h3>成功率</h3>
                <div class="value" id="successRate">0%</div>
            </div>
        </div>

        <div class="pages-grid" id="pagesGrid"></div>

        <div class="test-log">
            <h3>📋 测试日志</h3>
            <div id="logEntries"></div>
        </div>
    </div>

    <script>
        // 定义所有测试页面
        const testPages = [
            {
                id: 'page01',
                title: '随机事件与样本空间',
                file: '02-随机事件与样本空间.html',
                desc: '通过Venn图直观理解样本空间、事件及其运算',
                chapter: '第一章',
                priority: 'high'
            },
            {
                id: 'page02',
                title: '事件的独立性',
                file: '01-独立性.html',
                desc: '探索独立事件的特征：P(A∩B) = P(A) · P(B)',
                chapter: '第一章',
                priority: 'high'
            },
            {
                id: 'page03',
                title: '频率与概率',
                file: '03-频率与概率.html',
                desc: '通过模拟实验演示大数定律',
                chapter: '第一章',
                priority: 'core'
            },
            {
                id: 'page04',
                title: '数学期望',
                file: '04-数学期望.html',
                desc: '理解期望的几何意义：概率分布的"重心"',
                chapter: '第四章',
                priority: 'core'
            },
            {
                id: 'page05',
                title: '方差',
                file: '05-方差.html',
                desc: '可视化方差的意义：衡量数据的离散程度',
                chapter: '第四章',
                priority: 'core'
            },
            {
                id: 'page06',
                title: '全概率公式',
                file: '06-全概率公式.html',
                desc: '通过"划分样本空间"来计算复杂事件的概率',
                chapter: '第一章',
                priority: 'important'
            },
            {
                id: 'page07',
                title: '贝叶斯公式',
                file: '07-贝叶斯公式.html',
                desc: '逆向概率推理，根据新证据更新旧信念',
                chapter: '第一章',
                priority: 'core'
            },
            {
                id: 'page08',
                title: '中心极限定理',
                file: '08-中心极限定理.html',
                desc: '统计学最重要的定理：样本均值趋近正态分布',
                chapter: '第五章',
                priority: 'core'
            },
            {
                id: 'page09',
                title: '三大抽样分布对比',
                file: '09-三大抽样分布对比.html',
                desc: 'χ²分布、t分布、F分布的完整对比',
                chapter: '第六章',
                priority: 'important'
            },
            {
                id: 'page10',
                title: '假设检验流程',
                file: '10-假设检验流程.html',
                desc: '系统学习假设检验：两类错误、p值、功效分析',
                chapter: '第八章',
                priority: 'core'
            }
        ];

        // 页面状态
        const pageStatus = {};

        // 初始化
        function init() {
            renderPages();
            addLog('info', '✅ 测试页面已加载，准备开始测试');
        }

        // 渲染页面卡片
        function renderPages() {
            const grid = document.getElementById('pagesGrid');
            grid.innerHTML = testPages.map(page => `
                <div class="page-card status-pending" id="${page.id}">
                    <div class="page-card-header">
                        <div class="page-card-title">${page.title}</div>
                        <span class="page-badge pending" id="${page.id}-badge">待测试</span>
                    </div>
                    <div class="page-card-desc">${page.desc}</div>
                    <div class="page-card-info">
                        📖 ${page.chapter} | 🎯 优先级: ${getPriorityText(page.priority)}
                    </div>
                    <div class="page-card-actions">
                        <a href="${page.file}" target="_blank">🚀 打开页面</a>
                        <a href="#" class="test" onclick="testSinglePage('${page.id}'); return false;">🧪 单独测试</a>
                    </div>
                </div>
            `).join('');
        }

        function getPriorityText(priority) {
            const texts = {
                'core': '⭐⭐⭐ 核心',
                'important': '⭐⭐ 重要',
                'high': '⭐ 高优先级'
            };
            return texts[priority] || priority;
        }

        // 运行所有测试
        async function runAllTests() {
            const button = document.getElementById('runAllTests');
            button.disabled = true;
            button.innerHTML = '<span class="loading"></span> 测试中...';

            addLog('info', '🚀 开始运行所有测试...');

            for (let i = 0; i < testPages.length; i++) {
                const page = testPages[i];
                updateProgress((i / testPages.length) * 100);
                await testPage(page);
                await sleep(1000); // 间隔1秒
            }

            updateProgress(100);
            button.disabled = false;
            button.textContent = '▶️ 运行所有测试';

            const success = testPages.filter(p => pageStatus[p.id] === 'success').length;
            const total = testPages.length;
            addLog('success', `✅ 所有测试完成！成功率: ${success}/${total} (${(success/total*100).toFixed(1)}%)`);
        }

        // 测试单个页面
        async function testSinglePage(pageId) {
            const page = testPages.find(p => p.id === pageId);
            if (page) {
                await testPage(page);
            }
        }

        // 测试页面
        async function testPage(page) {
            addLog('info', `🔍 测试: ${page.title}`);

            try {
                // 检查文件是否存在
                const response = await fetch(page.file, { method: 'HEAD' });

                if (!response.ok) {
                    throw new Error(`文件不存在: ${response.status}`);
                }

                // 检查文件大小
                const size = response.headers.get('Content-Length');
                if (size && parseInt(size) < 1000) {
                    addLog('error', `⚠️ ${page.title}: 文件可能过小 (${size} bytes)`);
                }

                // 更新状态
                updatePageStatus(page.id, 'success');
                addLog('success', `✅ ${page.title}: 测试通过 (${(parseInt(size)/1024).toFixed(1)} KB)`);

            } catch (error) {
                updatePageStatus(page.id, 'error');
                addLog('error', `❌ ${page.title}: 测试失败 - ${error.message}`);
            }
        }

        // 更新页面状态
        function updatePageStatus(pageId, status) {
            pageStatus[pageId] = status;

            const card = document.getElementById(pageId);
            const badge = document.getElementById(`${pageId}-badge`);

            card.className = `page-card status-${status}`;

            if (status === 'success') {
                badge.textContent = '✅ 通过';
                badge.className = 'page-badge success';
            } else if (status === 'error') {
                badge.textContent = '❌ 失败';
                badge.className = 'page-badge error';
            }

            updateStats();
        }

        // 更新统计
        function updateStats() {
            const tested = Object.keys(pageStatus).length;
            const success = Object.values(pageStatus).filter(s => s === 'success').length;
            const error = Object.values(pageStatus).filter(s => s === 'error').length;
            const total = testPages.length;
            const rate = tested > 0 ? (success / tested * 100).toFixed(1) : 0;

            document.getElementById('testedPages').textContent = tested;
            document.getElementById('successPages').textContent = success;
            document.getElementById('errorPages').textContent = error;
            document.getElementById('successRate').textContent = `${rate}%`;
        }

        // 更新进度条
        function updateProgress(percent) {
            const fill = document.getElementById('progressFill');
            fill.style.width = `${percent}%`;
            fill.textContent = `${Math.round(percent)}%`;
        }

        // 添加日志
        function addLog(type, message) {
            const entries = document.getElementById('logEntries');
            const timestamp = new Date().toLocaleTimeString('zh-CN');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="timestamp">${timestamp}</span>${message}`;
            entries.insertBefore(entry, entries.firstChild);
        }

        // 清空日志
        function clearLog() {
            document.getElementById('logEntries').innerHTML = '';
            addLog('info', '🗑️ 日志已清空');
        }

        // 导出测试报告
        function exportReport() {
            const success = Object.values(pageStatus).filter(s => s === 'success').length;
            const error = Object.values(pageStatus).filter(s => s === 'error').length;
            const total = testPages.length;

            let report = '概率统计可视化测试报告\n';
            report += '=' .repeat(50) + '\n';
            report += `测试时间: ${new Date().toLocaleString('zh-CN')}\n`;
            report += `总页面数: ${total}\n`;
            report += `成功: ${success}\n`;
            report += `失败: ${error}\n`;
            report += `成功率: ${(success/total*100).toFixed(1)}%\n`;
            report += '\n详细结果:\n';
            report += '-'.repeat(50) + '\n';

            testPages.forEach(page => {
                const status = pageStatus[page.id] || '未测试';
                const statusText = status === 'success' ? '✅ 通过' :
                                   status === 'error' ? '❌ 失败' : '⏳ 未测试';
                report += `${statusText} ${page.title}\n`;
            });

            // 下载文件
            const blob = new Blob([report], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `test-report-${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);

            addLog('info', '📥 测试报告已导出');
        }

        // 辅助函数
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 页面加载时初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
