<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期末速通 - 测试版</title>
    <link rel="stylesheet" href="css/final-sprint-modern.css">
    <style>
        /* 确保页面可见 */
        body { visibility: visible !important; }
        #app { display: block !important; }
    </style>
</head>
<body>
    <div id="app">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-content">
                <h1>🎯 期末速通</h1>
                <p class="subtitle">概率统计 · 大学物理 · C++程序设计</p>
            </div>
        </header>

        <!-- 快速导航区域 -->
        <section class="quick-nav-section">
            <h2 class="section-title">快速导航</h2>
            <div class="quick-nav-cards">
                <!-- 概率统计可视化 -->
                <div class="quick-nav-card" onclick="window.location.href='概率统计可视化/index.html'" style="border: 2px solid #4285f4;">
                    <div class="nav-icon">🎲</div>
                    <h3>概率统计可视化</h3>
                    <p class="nav-desc">全书概念导航，10+个交互式可视化</p>
                    <div class="nav-stats">
                        <span class="stat-item"><strong>10+</strong> 个可视化</span>
                        <span class="stat-item new-badge"><strong>NEW</strong></span>
                    </div>
                    <button class="nav-btn">立即体验 →</button>
                </div>

                <!-- 学习进度 -->
                <div class="quick-nav-card">
                    <div class="nav-icon">📊</div>
                    <h3>学习进度</h3>
                    <p class="nav-desc">查看三门课程的整体学习进度和统计</p>
                    <div class="nav-stats">
                        <span class="stat-item"><strong>28</strong> 个考点</span>
                        <span class="stat-item"><strong>3</strong> 门课程</span>
                    </div>
                    <button class="nav-btn">查看进度 →</button>
                </div>
            </div>
        </section>

        <!-- 课程选择区域 -->
        <section class="course-selector">
            <h2 class="section-title">选择课程开始学习</h2>
            <div class="course-cards">
                <!-- 概率统计 -->
                <div class="course-card" data-course="probability">
                    <div class="course-icon">📊</div>
                    <h3>概率论与数理统计</h3>
                    <p class="course-desc">
                        分布可视化、统计推断、假设检验
                    </p>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 43%"></div>
                    </div>
                    <p class="progress-text"><span>3</span>/7 考点已掌握</p>
                </div>

                <!-- 大学物理 -->
                <div class="course-card" data-course="physics">
                    <div class="course-icon">⚛️</div>
                    <h3>大学物理（下册）</h3>
                    <p class="course-desc">
                        电磁学、波动光学、近代物理
                    </p>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                    <p class="progress-text"><span>0</span>/10 考点已掌握</p>
                </div>

                <!-- C++程序设计 -->
                <div class="course-card" data-course="cpp">
                    <div class="course-icon">💻</div>
                    <h3>C++程序设计</h3>
                    <p class="course-desc">
                        面向对象、继承多态、STL容器
                    </p>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                    <p class="progress-text"><span>0</span>/11 考点已掌握</p>
                </div>
            </div>
        </section>
    </div>

    <script>
        console.log('页面加载完成');
        console.log('DOM ready:', document.readyState);
        
        // 测试点击事件
        document.querySelectorAll('.quick-nav-card').forEach(card => {
            card.addEventListener('click', function() {
                console.log('卡片被点击');
            });
        });
    </script>
</body>
</html>
